<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Financeiro — Controle Doméstico</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --verde:#0a8a7a;--verde-escuro:#076b5e;
  --laranja:#e05020;
  --azul:#29abe2;--azul-escuro:#185FA5;
  --roxo:#7b3fa0;
  --vermelho:#c0392b;--vermelho-bg:#fdecea;
  --verde-bg:#e7f6f2;
  --cinza-bg:#f4f5f6;--cinza-borda:#dde1e5;
  --texto:#1a1f24;--texto-sec:#5a6472;--branco:#ffffff;
  --radius:8px;--radius-lg:12px;
}
body{font-family:'Source Sans 3',sans-serif;background:var(--cinza-bg);color:var(--texto);min-height:100vh;padding:0 0 3rem}

.header{background:var(--branco);border-bottom:3px solid var(--verde)}
.header-top{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 1.5rem;gap:1rem;flex-wrap:wrap;max-width:1000px;margin:0 auto}
.header-info h1{font-family:'Source Serif 4',serif;font-size:19px;font-weight:600;color:var(--verde-escuro)}
.header-info p{font-size:13px;color:var(--texto-sec);margin-top:2px}
.header-stripe{height:5px;background:linear-gradient(90deg,var(--verde) 0%,var(--verde) 40%,var(--laranja) 40%,var(--laranja) 75%,var(--azul) 75%,var(--azul) 100%)}

.abas-wrap{background:var(--branco);border-bottom:1px solid var(--cinza-borda);position:sticky;top:0;z-index:5}
.abas{display:flex;max-width:1000px;margin:0 auto;padding:0 1.5rem;gap:4px;overflow-x:auto}
.aba{padding:12px 18px;font-size:14px;font-weight:500;color:var(--texto-sec);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:all .15s;background:none;border-top:none;border-left:none;border-right:none;font-family:'Source Sans 3',sans-serif}
.aba:hover{color:var(--verde)}
.aba.ativa{color:var(--verde-escuro);border-bottom-color:var(--verde);font-weight:600}

.container{max-width:1000px;margin:1.5rem auto;padding:0 1.5rem}

.painel-topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:10px}
.painel-titulo{font-size:16px;font-weight:600;color:var(--texto)}

.btn-grupo{display:flex;gap:6px;flex-wrap:wrap;overflow-x:auto;padding-bottom:2px}
.btn-filtro{padding:6px 13px;border-radius:20px;font-size:12.5px;font-weight:600;font-family:'Source Sans 3',sans-serif;border:1.5px solid var(--cinza-borda);color:var(--texto-sec);cursor:pointer;background:var(--branco);transition:all .15s;white-space:nowrap}
.btn-filtro:hover{border-color:var(--verde);color:var(--verde)}
.btn-filtro.ativo{background:var(--verde);border-color:var(--verde);color:#fff}

.seletor-data{display:flex;gap:8px}
.select-data{font-family:'Source Sans 3',sans-serif;font-size:13px;font-weight:600;color:var(--texto);background:var(--branco);border:1.5px solid var(--cinza-borda);border-radius:8px;padding:7px 10px;cursor:pointer}
.select-data:focus{outline:none;border-color:var(--verde)}

.scorecards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:1.5rem}
.scorecard{background:var(--branco);border-radius:var(--radius-lg);border:1px solid var(--cinza-borda);padding:1.1rem 1rem;text-align:center}
.scorecard-label{font-size:11px;font-weight:600;color:var(--texto-sec);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.scorecard-valor{font-size:24px;font-weight:700;line-height:1;font-family:'Source Serif 4',serif;}
.scorecard-valor.azul{color:var(--azul-escuro)}
.scorecard-valor.verde{color:var(--verde)}
.scorecard-valor.laranja{color:var(--laranja)}
.scorecard-valor.vermelho{color:var(--vermelho)}
.scorecard-sub{font-size:11px;color:var(--texto-sec);margin-top:5px}

.card{background:var(--branco);border-radius:var(--radius-lg);border:1px solid var(--cinza-borda);padding:1.3rem 1.3rem 1.1rem;margin-bottom:1rem}
.card-titulo{font-size:14px;font-weight:600;color:var(--texto);margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between}
.card-titulo .tag{font-size:10.5px;font-weight:700;color:var(--verde-escuro);background:var(--verde-bg);border-radius:5px;padding:2px 7px;margin-right:8px;text-transform:uppercase;letter-spacing:.03em}
.card-titulo .head-total{font-family:'Source Serif 4',serif;font-weight:700;font-size:15px;color:var(--texto)}

.linha{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--cinza-borda)}
.linha:last-of-type{border-bottom:none}
.linha .nome{flex:1;font-size:13.5px;background:transparent;border:none;color:var(--texto);font-family:'Source Sans 3',sans-serif;padding:4px 2px;border-radius:4px}
.linha .nome:focus{outline:1.5px solid var(--verde);background:#fff}
.linha .valor{width:100px;text-align:right;font-family:'Source Serif 4',serif;font-size:13.5px;font-weight:600;border:none;background:transparent;color:var(--texto);padding:4px 4px;border-radius:4px}
.linha .valor:focus{outline:1.5px solid var(--verde);background:#fff}
.linha .del{border:none;background:none;color:#b8c0c8;cursor:pointer;font-size:13px;width:20px}
.linha .del:hover{color:var(--vermelho)}

.add-linha{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.add-linha input{font-family:'Source Sans 3',sans-serif;font-size:12.5px;border:1.5px solid var(--cinza-borda);background:#fff;border-radius:6px;padding:7px 9px;outline:none}
.add-linha input:focus{border-color:var(--verde)}
.add-linha input.f-nome{flex:1;min-width:110px}
.add-linha input.f-valor{width:88px;font-family:'Source Serif 4',serif}
.add-linha input.f-dia{width:56px;font-family:'Source Serif 4',serif}
.add-linha input.f-parcelas{width:88px;font-family:'Source Serif 4',serif}
.btn-add{font-family:'Source Sans 3',sans-serif;font-weight:600;font-size:12.5px;background:var(--verde);color:#fff;border:none;border-radius:6px;padding:7px 14px;cursor:pointer}
.btn-add:hover{background:var(--verde-escuro)}

.bruta-linha{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.bruta-linha label{font-size:13px;color:var(--texto-sec);font-weight:500}
.bruta-linha input{width:130px;text-align:right;font-family:'Source Serif 4',serif;font-size:16px;font-weight:700;border:1.5px solid var(--cinza-borda);border-radius:6px;padding:6px 10px;outline:none;color:var(--verde-escuro)}
.bruta-linha input:focus{border-color:var(--verde)}

.liquida-box{margin-top:10px;background:var(--verde-bg);border:1px solid #bfe3d9;border-radius:8px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.liquida-box .lbl{font-size:12.5px;color:var(--verde-escuro);font-weight:600}
.liquida-box .val{font-family:'Source Serif 4',serif;font-weight:700;font-size:18px;color:var(--verde-escuro)}

.despesa-linha{display:flex;align-items:center;gap:10px;padding:7px 8px;border-bottom:1px solid var(--cinza-borda);border-radius:6px;transition:background .15s ease}
.despesa-linha.pago{background:#eef8f4}
.icone-conta{font-size:15px;flex-shrink:0;width:20px;text-align:center}
.despesa-linha .dia{width:24px;flex-shrink:0;text-align:right;font-family:'Source Serif 4',serif;font-size:12.5px;color:var(--texto-sec);font-weight:600}
.despesa-linha .dia.vazio{opacity:.35}
.despesa-linha .nome{flex:1;font-size:13.5px;background:transparent;border:none;color:var(--texto);font-family:'Source Sans 3',sans-serif;padding:4px 2px;border-radius:4px}
.despesa-linha .nome:focus{outline:1.5px solid var(--verde);background:#fff}
.despesa-linha .valor{width:90px;text-align:right;font-family:'Source Serif 4',serif;font-size:13.5px;font-weight:600;border:none;background:transparent;color:var(--texto);padding:4px 4px;border-radius:4px;flex-shrink:0}
.despesa-linha .valor:focus{outline:1.5px solid var(--verde);background:#fff}

.status-toggle{font-family:'Source Sans 3',sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.02em;border:none;background:none;cursor:pointer;padding:4px 2px;white-space:nowrap;flex-shrink:0}
.status-toggle.pendente{color:var(--vermelho)}
.status-toggle.pago{color:var(--verde)}

.empty-hint{font-size:12.5px;color:var(--texto-sec);font-style:italic;padding:8px 0}

@media(max-width:600px){
  .scorecards{grid-template-columns:1fr}
  .header-top{padding:.9rem 1rem}
}
</style>
</head>
<body>
<div class="header">
  <div class="header-top">
    <div class="header-info">
      <h1>Painel Financeiro</h1>
      <p>Orçamento, receitas e contas — toque numa conta pra marcar como paga</p>
    </div>
  </div>
</div>
<div class="header-stripe"></div>

<div class="abas-wrap">
  <div class="abas" id="personTabs"></div>
</div>

<div class="container">
  <div class="painel-topo">
    <div class="painel-titulo" id="mesTitulo">—</div>
    <div class="seletor-data">
      <select class="select-data" id="anoSelect"></select>
      <select class="select-data" id="mesSelect"></select>
    </div>
  </div>
  <div id="content"></div>
</div>

      const { liquida } = calcHomeOrcamento(data, otherData);
      const outras = (data.receitas||[]).reduce((s,r)=>s+(Number(r.valor)||0),0);
      totalReceitas = liquida + outras;
    }
    const totalDespesas = (data.despesas||[]).reduce((s,d)=>s+(Number(d.valor)||0),0);
    const saldoFinal = totalReceitas - totalDespesas;
    return { totalReceitas, totalDespesas, saldoFinal };
  }

  // ---------- Navegação ----------
  function renderTabs(){
    const wrap = document.getElementById('personTabs');
    wrap.innerHTML = '';
    PEOPLE.forEach(p=>{
      const b = document.createElement('button');
      b.className = 'aba' + (state.person===p.key ? ' ativa':'');
      b.textContent = p.label;
      b.onclick = ()=>{ state.person = p.key; render(); };
      wrap.appendChild(b);
    });
  }

  function renderSeletorData(){
    const anoSel = document.getElementById('anoSelect');
    const mesSel = document.getElementById('mesSelect');
    anoSel.innerHTML = YEARS.map(y=>`<option value="${y}" ${y===state.year?'selected':''}>${y}</option>`).join('');
    mesSel.innerHTML = MONTHS.map((m,i)=>`<option value="${m}" ${m===state.month?'selected':''}>${MONTH_LABELS[i]}</option>`).join('');
    anoSel.onchange = ()=>{ state.year = anoSel.value; render(); };
    mesSel.onchange = ()=>{ state.month = mesSel.value; render(); };
    document.getElementById('mesTitulo').textContent = MONTH_LABELS[MONTHS.indexOf(state.month)] + ' / ' + state.year;
  }

  async function render(){
    renderTabs();
    renderSeletorData();
    const content = document.getElementById('content');
    content.innerHTML = '<div class="empty-hint">Carregando…</div>';
    const pauloData = await loadData('paulo', state.year, state.month);
    const homeData = await loadData('home', state.year, state.month);
    const data = state.person === 'paulo' ? pauloData : homeData;
    const other = state.person === 'paulo' ? homeData : pauloData;

    content.innerHTML = '';
    content.appendChild(buildSummary(state.person, data, other));
    if(state.person === 'paulo'){
      content.appendChild(buildOrcamentoPaulo(pauloData));
      content.appendChild(buildRemuneracoesCard(pauloData, homeData));
    } else {
      content.appendChild(buildOrcamentoHome(homeData, pauloData));
      const { liquida } = calcHomeOrcamento(homeData, pauloData);
      content.appendChild(buildReceitasCard('home', homeData, liquida));
    }
    content.appendChild(buildDespesasCard(data));
  }

  function persistAndRerender(){
    saveData(state.person, state.year, state.month);
    render();
  }

  // ---------- SUMMARY ----------
  function buildSummary(person, data, other){
    const wrap = document.createElement('div');
    wrap.className = 'scorecards';
    const t = calcTotals(person, data, other);
    wrap.innerHTML = `
      <div class="scorecard">
        <div class="scorecard-label">Total receitas</div>
        <div class="scorecard-valor azul">R$ ${fmt(t.totalReceitas)}</div>
        <div class="scorecard-sub">receita líquida + outras entradas</div>
      </div>
      <div class="scorecard">
        <div class="scorecard-label">Total contas</div>
        <div class="scorecard-valor laranja">R$ ${fmt(t.totalDespesas)}</div>
        <div class="scorecard-sub">todas as contas do mês</div>
      </div>
      <div class="scorecard">
        <div class="scorecard-label">Sobra após pagar tudo</div>
        <div class="scorecard-valor ${t.saldoFinal<0?'vermelho':'verde'}">R$ ${fmt(t.saldoFinal)}</div>
        <div class="scorecard-sub">receitas − contas do mês</div>
      </div>`;
    return wrap;
  }

  // ---------- ORÇAMENTO PAULO ----------
  function buildOrcamentoPaulo(data){
    const card = document.createElement('div');
    card.className = 'card';
    const { receitaLiquida, somaEmprestimos, receitaBruta } = calcPauloOrcamento(data);

    card.innerHTML = `<div class="card-titulo"><span><span class="tag">1</span>Orçamento</span></div>`;

    const brutaBox = document.createElement('div');
    brutaBox.className = 'liquida-box';
    brutaBox.innerHTML = `<span class="lbl">Receita bruta (calculada)</span><span class="val">R$ ${fmt(receitaBruta)}</span>`;
    card.appendChild(brutaBox);

    const liqRow = document.createElement('div');
    liqRow.className = 'bruta-linha';
    liqRow.innerHTML = `<label>Receita líquida (contracheque)</label>`;
    const liqInput = makeMoneyInput(
      ()=>data.receita_liquida,
      (v)=>{ data.receita_liquida = v; persistAndRerender(); },
      ''
    );
    liqRow.appendChild(liqInput);
    card.appendChild(liqRow);

    const label = document.createElement('div');
    label.style.cssText = 'font-size:11.5px;font-weight:600;color:var(--texto-sec);text-transform:uppercase;letter-spacing:.03em;margin:10px 0 2px;';
    label.textContent = 'Empréstimos fixos';
    card.appendChild(label);

    const list = document.createElement('div');
    (data.emprestimos||[]).forEach((e)=>{
      const row = document.createElement('div');
      row.className = 'linha';
      const nome = document.createElement('span');
      nome.className = 'nome';
      nome.style.pointerEvents = 'none';
      nome.style.opacity = '.85';
      nome.textContent = e.nome;
      const valI = makeMoneyInput(
        ()=>e.valor,
        (v)=>{ e.valor = v; persistAndRerender(); },
        'valor'
      );
      row.appendChild(nome); row.appendChild(valI);
      list.appendChild(row);
    });
    card.appendChild(list);

    const totalLine = document.createElement('div');
    totalLine.className = 'total-line';
    totalLine.innerHTML = `<span>Total do orçamento</span><span>R$ ${fmt(receitaBruta)}</span>`;
    card.appendChild(totalLine);

    return card;
  }

  // ---------- REMUNERAÇÕES (só Paulo) ----------
  function buildRemuneracoesCard(pauloData, homeData){
    const card = document.createElement('div');
    card.className = 'card';
    const r = calcRemuneracoes(pauloData, homeData);
    card.innerHTML = `
      <div class="card-titulo"><span><span class="tag">2</span>Remunerações</span></div>
      <div class="linha"><span class="nome" style="pointer-events:none;">EMSB</span><span class="valor" style="pointer-events:none;">R$ ${fmt(r.emsb)}</span></div>
      <div class="linha"><span class="nome" style="pointer-events:none;">NECA</span><span class="valor" style="pointer-events:none;">R$ ${fmt(r.neca)}</span></div>
      <div class="total-line"><span>Total remunerações</span><span>R$ ${fmt(r.total)}</span></div>
      <div class="empty-hint" style="margin-top:6px;">Base: receita bruta ÷ 3 = R$ ${fmt(r.terco)} · Funerária + Jazigo do mês (Minhas Contas): R$ ${fmt(r.fj)}</div>
    `;
    return card;
  }

  // ---------- ORÇAMENTO HOME ----------
  function buildOrcamentoHome(data, pauloData){
    const card = document.createElement('div');
    card.className = 'card';
    const o = calcHomeOrcamento(data, pauloData);
    card.innerHTML = `<div class="card-titulo"><span><span class="tag">1</span>Orçamento</span></div>`;

    const brutaRow = document.createElement('div');
    brutaRow.className = 'bruta-linha';
    brutaRow.innerHTML = `<label>Remuneração PGM</label>`;
    const brutaInput = makeMoneyInput(
      ()=>data.receita_bruta,
      (v)=>{ data.receita_bruta = v; persistAndRerender(); },
      ''
    );
    brutaRow.appendChild(brutaInput);
    card.appendChild(brutaRow);

    const pensaoRow = document.createElement('div');
    pensaoRow.className = 'linha';
    pensaoRow.innerHTML = `<span class="nome" style="opacity:.75;pointer-events:none;">Receita bruta pensão (EMSB do Paulo)</span><span class="valor" style="pointer-events:none;color:var(--verde-escuro);">R$ ${fmt(o.pensaoAuto)}</span>`;
    card.appendChild(pensaoRow);

    const extraLabel = document.createElement('div');
    extraLabel.style.cssText = 'font-size:11.5px;font-weight:600;color:var(--verde-escuro);text-transform:uppercase;letter-spacing:.03em;margin:10px 0 2px;';
    extraLabel.textContent = 'Outras receitas adicionais (somam)';
    card.appendChild(extraLabel);
    const extraList = document.createElement('div');
    renderListaSimples(extraList, data.receitas_extra_manual, 'var(--verde-escuro)', ()=>{ persistAndRerender(); });
    card.appendChild(extraList);
    card.appendChild(addLineFor('+ Receita extra', (nome,valor)=>{
      data.receitas_extra_manual.push({nome,valor}); persistAndRerender();
    }));

    const descLabel = document.createElement('div');
    descLabel.style.cssText = 'font-size:11.5px;font-weight:600;color:var(--vermelho);text-transform:uppercase;letter-spacing:.03em;margin:12px 0 2px;';
    descLabel.textContent = 'Descontos (subtraem)';
    card.appendChild(descLabel);
    const descList = document.createElement('div');
    renderListaSimples(descList, data.descontos, null, ()=>{ persistAndRerender(); });
    card.appendChild(descList);
    card.appendChild(addLineFor('+ Desconto', (nome,valor)=>{
      data.descontos.push({nome,valor}); persistAndRerender();
    }));

    const liquidaBox = document.createElement('div');
    liquidaBox.className = 'liquida-box';
    liquidaBox.innerHTML = `<span class="lbl">Receita líquida</span><span class="val">R$ ${fmt(o.liquida)}</span>`;
    card.appendChild(liquidaBox);

    return card;
  }

  function getIconeConta(nome){
    const n = (nome||'').toLowerCase();
    const mapa = [
      [['água','agua'], '💧'],
      [['energia','luz','enel','coelce'], '⚡'],
      [['internet','wifi','net ','alares'], '🌐'],
      [['telefone','celular','tim','vivo','claro','oi ','pago oi'], '📱'],
      [['aluguel'], '🏠'],
      [['condomínio','condominio'], '🏢'],
      [['mercado','feira','supermercado','compras'], '🛒'],
      [['combustível','combustivel','gasolina','posto'], '⛽'],
      [['farmácia','farmacia','remédio','remedio','saúde','saude','médico','medico','plano'], '💊'],
      [['escola','colégio','colegio','faculdade','curso','reforço','reforco'], '🎓'],
      [['cartão','cartao','crédito','credito','visa','master'], '💳'],
      [['carro','consórcio','consorcio','veículo','veiculo'], '🚗'],
      [['seguro'], '🛡️'],
      [['funerária','funeraria','jazigo'], '🕯️'],
      [['tv','streaming','netflix','clube'], '📺'],
      [['empréstimo','emprestimo'], '💸'],
      [['iptu','imposto','taxa'], '🧾'],
    ];
    for(const [chaves, icone] of mapa){
      if(chaves.some(k=>n.includes(k))) return icone;
    }
    return '📄';
  }

  // ---------- RECEITAS (Home apenas) ----------
  function buildReceitasCard(person, data, liquidaBase){
    const card = document.createElement('div');
    card.className = 'card';
    const soma = (data.receitas||[]).reduce((s,r)=>s+(Number(r.valor)||0),0);
    const novaRenda = (Number(liquidaBase)||0) + soma;
    card.innerHTML = `<div class="card-titulo"><span><span class="tag">2</span>Receitas extras (eventuais)</span></div>`;
    const list = document.createElement('div');
    renderListaSimples(list, data.receitas, null, ()=>{ persistAndRerender(); });
    card.appendChild(list);
    card.appendChild(addLineFor('+ Receita extra', (nome,valor)=>{
      data.receitas.push({nome,valor}); persistAndRerender();
    }));
    const novaRendaBox = document.createElement('div');
    novaRendaBox.className = 'liquida-box';
    novaRendaBox.innerHTML = `<span class="lbl">Nova renda (líquida + extras)</span><span class="val">R$ ${fmt(novaRenda)}</span>`;
    card.appendChild(novaRendaBox);
    return card;
  }

  function renderListaSimples(container, arr, corValor, onChange){
    container.innerHTML = '';
    (arr||[]).forEach((item, i)=>{
      const row = document.createElement('div');
      row.className = 'linha';
      const nameI = document.createElement('input');
      nameI.className = 'nome'; nameI.value = item.nome;
      nameI.oninput = ()=>{ item.nome = nameI.value; onChange(); };
      const valI = makeMoneyInput(()=>item.valor, (v)=>{ item.valor = v; onChange(); }, 'valor');
      if(corValor) valI.style.color = corValor;
      const del = document.createElement('button');
      del.className = 'del'; del.innerHTML = '✕';
      del.onclick = ()=>{ arr.splice(i,1); renderListaSimples(container, arr, corValor, onChange); onChange(); };
      row.appendChild(nameI); row.appendChild(valI); row.appendChild(del);
      container.appendChild(row);
    });
    if(!(arr||[]).length){ container.innerHTML = '<div class="empty-hint">Nenhum item.</div>'; }
  }

  function addLineFor(label, onAdd){
    const addLine = document.createElement('div');
    addLine.className = 'add-linha';
    addLine.innerHTML = `<input class="f-nome" placeholder="Nome"><input class="f-valor" type="number" step="0.01" placeholder="Valor"><button class="btn-add">${label}</button>`;
    const nameI = addLine.querySelector('.f-nome');
    const valI = addLine.querySelector('.f-valor');
    addLine.querySelector('.btn-add').onclick = ()=>{
      const nome = nameI.value.trim();
      const valor = parseFloat(valI.value)||0;
      if(!nome) return;
      onAdd(nome, valor);
      nameI.value=''; valI.value='';
    };
    return addLine;
  }

  // ---------- DESPESAS ----------
  function buildDespesasCard(data){
    const card = document.createElement('div');
    card.className = 'card';
    const tagNum = state.person==='paulo' ? '4' : '3';
    card.innerHTML = `<div class="card-titulo"><span><span class="tag">${tagNum}</span>Contas do mês</span></div>`;

    const list = document.createElement('div');
    renderDespesasList(list, data);
    card.appendChild(list);

    const addLine = document.createElement('div');
    addLine.className = 'add-linha';
    addLine.innerHTML = `
      <input class="f-dia" type="number" min="1" max="31" placeholder="Dia">
      <input class="f-nome" placeholder="Nova conta">
      <input class="f-valor" type="number" step="0.01" placeholder="Valor">
      <input class="f-parcelas" type="number" min="1" max="60" placeholder="Nº parcelas">
      <button class="btn-add">+ Conta</button>`;
    const dayI = addLine.querySelector('.f-dia');
    const nameI = addLine.querySelector('.f-nome');
    const valI = addLine.querySelector('.f-valor');
    const parcI = addLine.querySelector('.f-parcelas');
    addLine.querySelector('.btn-add').onclick = async ()=>{
      const nome = nameI.value.trim();
      const valor = parseFloat(valI.value)||0;
      const dia = dayI.value ? parseInt(dayI.value) : null;
      const parcelas = parcI.value ? Math.max(1, parseInt(parcI.value)) : 1;
      if(!nome) return;
      data.despesas.push({nome, valor, vencimento: dia, pago:false});
      persistAndRerender();
      for(let i=1; i<parcelas; i++){
        const alvo = nextYearMonth(state.year, state.month, i);
        const futData = await loadData(state.person, alvo.year, alvo.month);
        futData.despesas.push({nome, valor, vencimento: dia, pago:false});
        saveData(state.person, alvo.year, alvo.month);
      }
      dayI.value=''; nameI.value=''; valI.value=''; parcI.value='';
    };
    card.appendChild(addLine);
    return card;
  }

  function renderDespesasList(container, data){
    container.innerHTML = '';
    const items = data.despesas.map((d,i)=>({...d, _i:i}));
    items.sort((a,b)=>{
      const av = a.vencimento==null ? 999 : a.vencimento;
      const bv = b.vencimento==null ? 999 : b.vencimento;
      return av - bv;
    });
    if(!items.length){ container.innerHTML = '<div class="empty-hint">Nenhuma conta lançada ainda.</div>'; return; }
    items.forEach(d=>{
      const row = document.createElement('div');
      row.className = 'despesa-linha' + (d.pago ? ' pago' : '');

      const icone = document.createElement('span');
      icone.className = 'icone-conta';
      icone.textContent = getIconeConta(d.nome);
      row.appendChild(icone);

      const day = document.createElement('div');
      day.className = 'dia' + (d.vencimento==null ? ' vazio':'');
      day.textContent = d.vencimento==null ? '—' : String(d.vencimento).padStart(2,'0');
      row.appendChild(day);

      const nameI = document.createElement('input');
      nameI.className='nome'; nameI.value=d.nome;
      nameI.oninput = ()=>{ data.despesas[d._i].nome = nameI.value; persistAndRerender(); };
      row.appendChild(nameI);

      const valI = makeMoneyInput(
        ()=>data.despesas[d._i].valor,
        (v)=>{ data.despesas[d._i].valor = v; persistAndRerender(); },
        'valor'
      );
      row.appendChild(valI);

      const stamp = document.createElement('button');
      stamp.className = 'status-toggle ' + (d.pago ? 'pago' : 'pendente');
      stamp.textContent = d.pago ? '✓ PAGO' : 'PENDENTE';
      stamp.onclick = ()=>{
        data.despesas[d._i].pago = !data.despesas[d._i].pago;
        persistAndRerender();
      };
      row.appendChild(stamp);

      const del = document.createElement('button');
      del.className='del'; del.innerHTML='✕';
      del.onclick = ()=>{ data.despesas.splice(d._i,1); persistAndRerender(); };
      row.appendChild(del);

      container.appendChild(row);
    });
  }

  render();
})();
</script>
</body>
</html>
