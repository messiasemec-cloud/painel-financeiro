<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Financeiro — Controle Doméstico</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --verde:#0a8a7a;--verde-escuro:#076b5e;
  --laranja:#e05020;
  --azul:#29abe2;--azul-escuro:#185FA5;
  --roxo:#7b3fa0;
  --vermelho:#c0392b;--vermelho-bg:#fdecea;
  --verde-bg:#e7f6f2;
  --cinza-bg:#f4f5f6;--cinza-borda:#dde1e5;
  --texto:#1a1f24;--texto-sec:#5a6472;--branco:#ffffff;
  --radius:8px;--radius-lg:12px;
}
body{font-family:'Source Sans 3',sans-serif;background:var(--cinza-bg);color:var(--texto);min-height:100vh;padding:0 0 3rem}

.header{background:var(--branco);border-bottom:3px solid var(--verde)}
.header-top{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 1.5rem;gap:1rem;flex-wrap:wrap;max-width:1000px;margin:0 auto}
.header-info h1{font-family:'Source Serif 4',serif;font-size:19px;font-weight:600;color:var(--verde-escuro)}
.header-info p{font-size:13px;color:var(--texto-sec);margin-top:2px}
.header-stripe{height:5px;background:linear-gradient(90deg,var(--verde) 0%,var(--verde) 40%,var(--laranja) 40%,var(--laranja) 75%,var(--azul) 75%,var(--azul) 100%)}

.abas-wrap{background:var(--branco);border-bottom:1px solid var(--cinza-borda);position:sticky;top:0;z-index:5}
.abas{display:flex;max-width:1000px;margin:0 auto;padding:0 1.5rem;gap:4px;overflow-x:auto}
.aba{padding:12px 18px;font-size:14px;font-weight:500;color:var(--texto-sec);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:all .15s;background:none;border-top:none;border-left:none;border-right:none;font-family:'Source Sans 3',sans-serif}
.aba:hover{color:var(--verde)}
.aba.ativa{color:var(--verde-escuro);border-bottom-color:var(--verde);font-weight:600}

.container{max-width:1000px;margin:1.5rem auto;padding:0 1.5rem}

.painel-topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:10px}
.painel-titulo{font-size:16px;font-weight:600;color:var(--texto)}

.btn-grupo{display:flex;gap:6px;flex-wrap:wrap;overflow-x:auto;padding-bottom:2px}
.btn-filtro{padding:6px 13px;border-radius:20px;font-size:12.5px;font-weight:600;font-family:'Source Sans 3',sans-serif;border:1.5px solid var(--cinza-borda);color:var(--texto-sec);cursor:pointer;background:var(--branco);transition:all .15s;white-space:nowrap}
.btn-filtro:hover{border-color:var(--verde);color:var(--verde)}
.btn-filtro.ativo{background:var(--verde);border-color:var(--verde);color:#fff}

.seletor-data{display:flex;gap:8px}
.select-data{font-family:'Source Sans 3',sans-serif;font-size:13px;font-weight:600;color:var(--texto);background:var(--branco);border:1.5px solid var(--cinza-borda);border-radius:8px;padding:7px 10px;cursor:pointer}
.select-data:focus{outline:none;border-color:var(--verde)}
.topo-direita{display:flex;align-items:center;gap:10px}
.btn-undo{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--cinza-borda);background:var(--branco);color:var(--texto-sec);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.btn-undo:hover:not(:disabled){border-color:var(--verde);color:var(--verde)}
.btn-undo:disabled{opacity:.3;cursor:default}

.scorecards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:1.5rem}
.scorecard{background:var(--branco);border-radius:var(--radius-lg);border:1px solid var(--cinza-borda);padding:1.1rem 1rem;text-align:center}
.scorecard-label{font-size:11px;font-weight:600;color:var(--texto-sec);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.scorecard-valor{font-size:24px;font-weight:700;line-height:1;font-family:'Source Serif 4',serif;}
.scorecard-valor.azul{color:var(--azul-escuro)}
.scorecard-valor.verde{color:var(--verde)}
.scorecard-valor.laranja{color:var(--laranja)}
.scorecard-valor.vermelho{color:var(--vermelho)}
.scorecard-sub{font-size:11px;color:var(--texto-sec);margin-top:5px}

.status-banner{border-radius:var(--radius-lg);padding:12px 16px;margin-bottom:1rem;font-size:14px;font-weight:700;text-align:center;border:1.5px solid}
.status-banner.ok{background:var(--verde-bg);border-color:#bfe3d9;color:var(--verde-escuro)}
.status-banner.pendente{background:#fff4e8;border-color:#f5cfa0;color:#a8620c}
.status-banner.atrasada{background:#fdeeec;border-color:#f0b3aa;color:var(--vermelho)}
.status-banner.neutro{background:var(--cinza-bg);border-color:var(--cinza-borda);color:var(--texto-sec);font-weight:600}

.modal-overlay{position:fixed;inset:0;background:rgba(20,24,28,.55);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-box{background:#fff;border-radius:var(--radius-lg);padding:20px;max-width:360px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal-titulo{font-family:'Source Serif 4',serif;font-weight:700;font-size:15px;color:var(--texto);margin-bottom:6px}
.modal-texto{font-size:13px;color:var(--texto-sec);margin-bottom:16px}
.modal-botoes{display:flex;flex-direction:column;gap:8px}
.modal-btn{font-family:'Source Sans 3',sans-serif;font-size:13px;font-weight:600;padding:10px;border-radius:7px;border:1.5px solid var(--cinza-borda);background:#fff;color:var(--texto);cursor:pointer}
.modal-btn:hover{border-color:var(--verde)}
.modal-btn.destaque{background:var(--vermelho);border-color:var(--vermelho);color:#fff}
.modal-btn.destaque:hover{background:var(--vermelho-dark,#9a2c1e)}
.modal-btn.cancelar{color:var(--texto-sec)}

.parcela-tag{font-size:11px;color:var(--texto-sec);font-weight:600;margin-left:4px}

.copiar-mes{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;padding-top:10px;border-top:1px dashed var(--cinza-borda)}
.copiar-label{font-size:12.5px;color:var(--texto-sec);font-weight:600}
.copiar-mes .select-data{padding:5px 8px;font-size:12.5px}
.emprestimo-linha{flex-wrap:wrap}
.parcela-inputs{display:flex;align-items:center;gap:2px;font-size:12px;color:var(--texto-sec);flex-shrink:0}
.parcela-num{width:36px;text-align:center;font-family:'Source Serif 4',serif;font-size:12px;border:1px solid var(--cinza-borda);border-radius:4px;padding:3px 2px}
.parcela-num:focus{outline:none;border-color:var(--verde)}
.btn-parcelar{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--cinza-borda);background:#fff;color:var(--texto-sec);font-size:13px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.btn-parcelar:hover{border-color:var(--verde);color:var(--verde)}
.modal-campos{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.modal-campos label{font-size:12.5px;color:var(--texto-sec);font-weight:600;display:flex;flex-direction:column;gap:4px}
.modal-campos input{font-family:'Source Serif 4',serif;font-size:14px;font-weight:600;color:var(--texto);border:1.5px solid var(--cinza-borda);border-radius:6px;padding:7px 9px}
.modal-campos input:focus{outline:none;border-color:var(--verde)}

.card{background:var(--branco);border-radius:var(--radius-lg);border:1px solid var(--cinza-borda);padding:1.3rem 1.3rem 1.1rem;margin-bottom:1rem}
.card-titulo{font-size:14px;font-weight:600;color:var(--texto);margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between}
.card-titulo .tag{font-size:10.5px;font-weight:700;color:var(--verde-escuro);background:var(--verde-bg);border-radius:5px;padding:2px 7px;margin-right:8px;text-transform:uppercase;letter-spacing:.03em}
.card-titulo .head-total{font-family:'Source Serif 4',serif;font-weight:700;font-size:15px;color:var(--texto)}

.linha{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--cinza-borda)}
.linha:last-of-type{border-bottom:none}
.linha .nome{flex:1;font-size:13.5px;background:transparent;border:none;color:var(--texto);font-family:'Source Sans 3',sans-serif;padding:4px 2px;border-radius:4px}
.linha .nome:focus{outline:1.5px solid var(--verde);background:#fff}
.linha .valor{width:100px;text-align:right;font-family:'Source Serif 4',serif;font-size:13.5px;font-weight:600;border:none;background:transparent;color:var(--texto);padding:4px 4px;border-radius:4px}
.linha .valor:focus{outline:1.5px solid var(--verde);background:#fff}
.linha .del{border:none;background:none;color:#b8c0c8;cursor:pointer;font-size:13px;width:20px}
.linha .del:hover{color:var(--vermelho)}

.add-linha{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.add-linha input{font-family:'Source Sans 3',sans-serif;font-size:12.5px;border:1.5px solid var(--cinza-borda);background:#fff;border-radius:6px;padding:7px 9px;outline:none}
.add-linha input:focus{border-color:var(--verde)}
.add-linha input.f-nome{flex:1;min-width:110px}
.add-linha input.f-valor{width:88px;font-family:'Source Serif 4',serif}
.add-linha input.f-dia{width:56px;font-family:'Source Serif 4',serif}
.add-linha input.f-parcelas{width:88px;font-family:'Source Serif 4',serif}
.btn-add{font-family:'Source Sans 3',sans-serif;font-weight:600;font-size:12.5px;background:var(--verde);color:#fff;border:none;border-radius:6px;padding:7px 14px;cursor:pointer}
.btn-add:hover{background:var(--verde-escuro)}

.bruta-linha{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.bruta-linha label{font-size:13px;color:var(--texto-sec);font-weight:500}
.bruta-linha input{width:130px;text-align:right;font-family:'Source Serif 4',serif;font-size:16px;font-weight:700;border:1.5px solid var(--cinza-borda);border-radius:6px;padding:6px 10px;outline:none;color:var(--verde-escuro)}
.bruta-linha input:focus{border-color:var(--verde)}

.liquida-box{margin-top:10px;background:var(--verde-bg);border:1px solid #bfe3d9;border-radius:8px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.liquida-box .lbl{font-size:12.5px;color:var(--verde-escuro);font-weight:600}
.liquida-box .val{font-family:'Source Serif 4',serif;font-weight:700;font-size:18px;color:var(--verde-escuro)}
.liquida-box.vermelha{background:var(--vermelho-bg);border-color:#f0c4bd}
.liquida-box.vermelha .lbl,.liquida-box.vermelha .val{color:var(--vermelho)}

.despesa-linha{display:flex;align-items:center;gap:10px;padding:7px 8px;border-bottom:1px solid var(--cinza-borda);border-radius:6px;transition:background .15s ease}
.despesa-linha.pago{background:#eef8f4}
.despesa-linha.atrasada{background:#fdeeec}
.icone-conta{font-size:15px;flex-shrink:0;width:20px;text-align:center}
.despesa-linha .dia{width:32px;flex-shrink:0;text-align:center;font-family:'Source Serif 4',serif;font-size:12.5px;color:var(--texto-sec);font-weight:600;border:none;background:transparent;border-radius:4px;padding:3px 0}
.despesa-linha .dia:focus{outline:1.5px solid var(--verde);background:#fff}
.despesa-linha .dia.vazio{opacity:.55}
.despesa-linha .nome{flex:1;font-size:13.5px;background:transparent;border:none;color:var(--texto);font-family:'Source Sans 3',sans-serif;padding:4px 2px;border-radius:4px}
.despesa-linha .nome:focus{outline:1.5px solid var(--verde);background:#fff}
.despesa-linha .valor{width:90px;text-align:right;font-family:'Source Serif 4',serif;font-size:13.5px;font-weight:600;border:none;background:transparent;color:var(--texto);padding:4px 4px;border-radius:4px;flex-shrink:0}
.despesa-linha .valor:focus{outline:1.5px solid var(--verde);background:#fff}

.status-toggle{font-family:'Source Sans 3',sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.02em;border:none;background:none;cursor:pointer;padding:4px 2px;white-space:nowrap;flex-shrink:0}
.status-toggle.pendente{color:#a8620c}
.status-toggle.pago{color:var(--verde)}
.status-toggle.atrasada{color:#a8231a}

.empty-hint{font-size:12.5px;color:var(--texto-sec);font-style:italic;padding:8px 0}

@media(max-width:600px){
  .scorecards{grid-template-columns:1fr}
  .header-top{padding:.9rem 1rem}
}
</style>
</head>
<body>
<div class="header">
  <div class="header-top">
    <div class="header-info">
      <h1>Painel Financeiro</h1>
      <p>Orçamento, receitas e contas — toque numa conta pra marcar como paga</p>
    </div>
  </div>
</div>
<div class="header-stripe"></div>

<div class="abas-wrap">
  <div class="abas" id="personTabs"></div>
</div>

<div class="container">
  <div class="painel-topo">
    <div class="painel-titulo" id="mesTitulo">—</div>
    <div class="topo-direita">
      <button id="btnDesfazer" class="btn-undo" title="Desfazer última edição">↶</button>
      <button id="btnRefazer" class="btn-undo" title="Refazer">↷</button>
      <div class="seletor-data">
        <select class="select-data" id="anoSelect"></select>
        <select class="select-data" id="mesSelect"></select>
      </div>
    </div>
  </div>
  <div id="content"></div>
</div>

        _fixado: {contracheque:false, emp0:false, emp1:false, emp2:false}
      };
    }
    const receitaBrutaHome = is2026 ? (SEED.home_receita_bruta[month]||0) : (await buscarHomeAnterior(year, month) || 0);
    return {
      receita_bruta: receitaBrutaHome,
      descontos: is2026 ? (SEED.home_descontos[month]||[]).map(d=>({nome:d.nome, valor:d.valor})) : [],
      receitas_extra_manual: is2026 ? (SEED.home_receitas_extra[month]||[]).map(d=>({nome:d.nome, valor:d.valor})) : [],
      receitas: is2026 ? (SEED.home_receitas[month]||[]).map(r=>({nome:r.nome, valor:r.valor})) : [],
      despesas: is2026 ? (SEED.home_despesas[month]||[]).map(d=>({nome:d.nome, valor:d.valor, vencimento:d.vencimento, pago:false})) : [],
      _fixadoHome: {receita_bruta: is2026}
    };
  }

  let cache = {};
  let saveTimers = {};

  const SHEETS_API_URL = 'https://script.google.com/macros/s/AKfycbyoQDn4AIXMYzbzVq6701oTfT0NnR1bsJWbUs7hIF_PqGamZJf9ZdCIgvQuEgnbaWmv/exec';

  async function storageGet(key){
    if(window.storage){ try{ return await window.storage.get(key, false); }catch(e){ return null; } }
    if(SHEETS_API_URL){
      try{
        const res = await fetch(SHEETS_API_URL + '?key=' + encodeURIComponent(key));
        const json = await res.json();
        if(json && json.value != null){
          try{ localStorage.setItem(key, json.value); }catch(e){}
          return {value: json.value};
        }
      }catch(e){ console.error('Sem conexão com a planilha, usando cópia local', e); }
    }
    try{ const v = localStorage.getItem(key); return v!=null ? {value:v} : null; }catch(e){ return null; }
  }

  async function storageSet(key, value){
    if(window.storage){ try{ return await window.storage.set(key, value, false); }catch(e){ console.error('Erro ao salvar', e); return; } }
    try{ localStorage.setItem(key, value); }catch(e){}
    if(SHEETS_API_URL){
      try{
        await fetch(SHEETS_API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({key, value}) });
      }catch(e){ console.error('Erro ao sincronizar com a planilha', e); }
    }
  }

  async function loadData(person, year, month){
    const key = storageKey(person, year, month);
    if(cache[key]) return cache[key];
    let dado = null;
    try{
      const res = await storageGet(key);
      if(res && res.value){ dado = JSON.parse(res.value); }
    }catch(e){}
    if(!dado){
      dado = await defaultDataFor(person, year, month);
      cache[key] = dado;
      saveData(person, year, month);
      return dado;
    }
    // Migração pontual: renomeia campo antigo receita_liquida -> contracheque
    let migrado = false;
    if(person === 'paulo' && dado.contracheque === undefined && dado.receita_liquida !== undefined){
      dado.contracheque = dado.receita_liquida;
      delete dado.receita_liquida;
      migrado = true;
    }
    // Migração pontual: preenche empréstimos do Paulo se ainda estiverem zerados
    if(person === 'paulo' && year === '2026' && dado.emprestimos && !dado._emp_seed_aplicado){
      const somaAtual = dado.emprestimos.reduce((s,e)=>s+(Number(e.valor)||0),0);
      const seedVals = EMPRESTIMOS_SEED[month] || [0,0,0];
      if(somaAtual === 0 && seedVals.some(v=>v!==0)){
        dado.emprestimos[0].valor = seedVals[0];
        dado.emprestimos[1].valor = seedVals[1];
        dado.emprestimos[2].valor = seedVals[2];
      }
      dado._emp_seed_aplicado = true;
      migrado = true;
    }
    // Migração pontual: adiciona campo ajuste se não existir
    if(person === 'paulo' && year === '2026' && dado.ajuste === undefined){
      dado.ajuste = AJUSTE_SEED[month] || 0;
      migrado = true;
    }
    // Migração pontual: adiciona trava _fixado se não existir
    if(person === 'paulo' && dado._fixado === undefined){
      const temSeedHistorico = year === '2026' && CONTRACHEQUE_SEED[month];
      dado._fixado = temSeedHistorico
        ? {contracheque:true, emp0:true, emp1:true, emp2:true}
        : {contracheque:false, emp0:false, emp1:false, emp2:false};
      migrado = true;
    }
    if(person === 'home' && dado._fixadoHome === undefined){
      dado._fixadoHome = { receita_bruta: year === '2026' };
      migrado = true;
    }
    if(person === 'paulo' && dado.emprestimos && dado.emprestimos.some(e=>e.parcelaRef === undefined)){
      dado.emprestimos.forEach(e=>{
        if(e.parcelaRef === undefined){
          if(e.parcelaAtual && e.parcelaTotal){
            e.parcelaRef = { year, month, parcela: e.parcelaAtual, total: e.parcelaTotal };
          } else {
            e.parcelaRef = null;
          }
        }
        delete e.parcelaAtual;
        delete e.parcelaTotal;
        delete e.finalizado;
      });
      migrado = true;
    }
    if(person === 'paulo' && year === '2026' && ['SET','OUT','NOV','DEZ'].includes(month) && !dado._parcelaSetAplicada){
      if(dado.emprestimos && dado.emprestimos[0]) dado.emprestimos[0].parcelaRef = {year:'2026', month:'SET', parcela:28, total:96};
      if(dado.emprestimos && dado.emprestimos[1]) dado.emprestimos[1].parcelaRef = {year:'2026', month:'SET', parcela:19, total:36};
      if(dado.emprestimos && dado.emprestimos[2]) dado.emprestimos[2].parcelaRef = {year:'2026', month:'SET', parcela:15, total:18};
      dado._parcelaSetAplicada = true;
      migrado = true;
    }
    if(person === 'paulo' && !dado._parcelaSincronizada){
      const anterior = await buscarPauloAnterior(year, month);
      if(anterior){
        const contrachequeFixado = dado._fixado && dado._fixado.contracheque;
        if(!contrachequeFixado && (Number(dado.contracheque)||0) === 0 && anterior.contracheque > 0){
          dado.contracheque = anterior.contracheque;
        }
        if(dado.emprestimos && anterior.emprestimos){
          for(let idx=0; idx<3; idx++){
            const fixado = dado._fixado && dado._fixado['emp'+idx];
            if(fixado) continue;
            const atualEntry = dado.emprestimos[idx];
            const antEntry = anterior.emprestimos[idx];
            if(!atualEntry || !antEntry) continue;
            const atualValor = Number(atualEntry.valor)||0;
            const antValor = Number(antEntry.valor)||0;
            if(antEntry.parcelaRef && !atualEntry.parcelaRef){
              atualEntry.parcelaRef = antEntry.parcelaRef;
              atualEntry.valor = antValor;
            } else if(atualValor === 0 && !atualEntry.parcelaRef && antValor > 0){
              atualEntry.valor = antValor;
            }
          }
        }
      }
      dado._parcelaSincronizada = true;
      migrado = true;
    }
    cache[key] = dado;
    if(migrado) saveData(person, year, month);
    return dado;
  }

  function saveData(person, year, month){
    const key = storageKey(person, year, month);
    clearTimeout(saveTimers[key]);
    saveTimers[key] = setTimeout(()=>{ storageSet(key, JSON.stringify(cache[key])); }, 250);
  }

  function nextYearMonth(year, month, offset){
    let idx = MONTHS.indexOf(month) + offset;
    let y = parseInt(year);
    while(idx > 11){ idx -= 12; y += 1; }
    while(idx < 0){ idx += 12; y -= 1; }
    return { year: String(y), month: MONTHS[idx] };
  }

  function mesIndice(year, month){
    return parseInt(year)*12 + MONTHS.indexOf(month);
  }

  function resolverEmprestimo(e, year, month){
    if(!e || !e.parcelaRef){
      return { valor: (e ? Number(e.valor)||0 : 0), parcelaAtual: null, parcelaTotal: null, finalizado: false };
    }
    const ref = e.parcelaRef;
    const diff = mesIndice(year, month) - mesIndice(ref.year, ref.month);
    const parcelaCalc = ref.parcela + diff;
    if(parcelaCalc > ref.total || parcelaCalc < 1){
      return { valor: 0, parcelaAtual: null, parcelaTotal: null, finalizado: true };
    }
    return { valor: Number(e.valor)||0, parcelaAtual: parcelaCalc, parcelaTotal: ref.total, finalizado: false };
  }

  // ---------- Cálculos ----------
  function calcPauloOrcamento(pauloData){
    const soma = (pauloData.emprestimos||[]).reduce((s,e)=>s+resolverEmprestimo(e, state.year, state.month).valor,0);
    const contracheque = Number(pauloData.contracheque)||0;
    const receitaBruta = contracheque + soma;
    return { contracheque, somaEmprestimos: soma, receitaBruta };
  }

  function calcRemuneracoes(pauloData, homeData){
    const { receitaBruta } = calcPauloOrcamento(pauloData);
    const terco = receitaBruta / 3;
    const ajuste = Number(pauloData.ajuste)||0;
    const empNeca = resolverEmprestimo(pauloData.emprestimos[0], state.year, state.month).valor;
    const empPaulo = resolverEmprestimo(pauloData.emprestimos[1], state.year, state.month).valor;
    const empMeu = resolverEmprestimo(pauloData.emprestimos[2], state.year, state.month).valor;
    const neca = terco - empNeca - ajuste;
    const emsb = terco - empMeu + ajuste;
    const receitaLiquida = terco - empPaulo;
    return { terco, ajuste, neca, emsb, receitaLiquida };
  }

  function getEmprestimoHome(homeData){
    return (homeData.descontos||[]).filter(d=>/empr[ée]stimo/i.test(d.nome||'')).reduce((s,d)=>s+(Number(d.valor)||0),0);
  }

  function calcHomeOrcamento(homeData, pauloData){
    const bruta = Number(homeData.receita_bruta)||0;
    const descontosVisiveis = filtrarDescontosHome(homeData, pauloData);
    const empHomeAtivo = descontosVisiveis.filter(d=>/empr[ée]stimo/i.test(d.nome||'')).reduce((s,d)=>s+(Number(d.valor)||0),0);
    const pensaoAuto = calcRemuneracoes(pauloData, homeData).emsb + empHomeAtivo;
    const extraManual = (homeData.receitas_extra_manual||[]).reduce((s,d)=>s+(Number(d.valor)||0),0);
    const descTotal = descontosVisiveis.reduce((s,d)=>s+(Number(d.valor)||0),0);
    const liquida = bruta + pensaoAuto + extraManual - descTotal;
    return { bruta, pensaoAuto, extraManual, descTotal, liquida };
  }

  function calcTotals(person, data, otherData){
    let totalReceitas;
    if(person === 'paulo'){
      const { receitaLiquida } = calcRemuneracoes(data, otherData);
      totalReceitas = receitaLiquida;
    } else {
      const { liquida } = calcHomeOrcamento(data, otherData);
      const outras = (data.receitas||[]).reduce((s,r)=>s+(Number(r.valor)||0),0);
      totalReceitas = liquida + outras;
    }
    const totalDespesas = (data.despesas||[]).reduce((s,d)=>s+(Number(d.valor)||0),0);
    const saldoFinal = totalReceitas - totalDespesas;
    return { totalReceitas, totalDespesas, saldoFinal };
  }

  // ---------- Navegação ----------
  function renderTabs(){
    const wrap = document.getElementById('personTabs');
    wrap.innerHTML = '';
    PEOPLE.forEach(p=>{
      const b = document.createElement('button');
      b.className = 'aba' + (state.person===p.key ? ' ativa':'');
      b.textContent = p.label;
      b.onclick = ()=>{ state.person = p.key; render(); };
      wrap.appendChild(b);
    });
  }

  function renderSeletorData(){
    const anoSel = document.getElementById('anoSelect');
    const mesSel = document.getElementById('mesSelect');
    anoSel.innerHTML = YEARS.map(y=>`<option value="${y}" ${y===state.year?'selected':''}>${y}</option>`).join('');
    mesSel.innerHTML = MONTHS.map((m,i)=>`<option value="${m}" ${m===state.month?'selected':''}>${MONTH_LABELS[i]}</option>`).join('');
    anoSel.onchange = ()=>{ state.year = anoSel.value; render(); };
    mesSel.onchange = ()=>{ state.month = mesSel.value; render(); };
    document.getElementById('mesTitulo').textContent = MONTH_LABELS[MONTHS.indexOf(state.month)] + ' / ' + state.year;
  }

  let undoStack = [];
  let redoStack = [];
  let lastSnapshot = null;
  let lastSnapshotCtx = null;

  async function render(){
    renderTabs();
    renderSeletorData();
    const content = document.getElementById('content');
    content.innerHTML = '<div class="empty-hint">Carregando…</div>';
    const pauloData = await loadData('paulo', state.year, state.month);
    const homeData = await loadData('home', state.year, state.month);
    const data = state.person === 'paulo' ? pauloData : homeData;
    const other = state.person === 'paulo' ? homeData : pauloData;

    content.innerHTML = '';
    content.appendChild(buildSummary(state.person, data, other));
    content.appendChild(buildStatusPendencias(data));
    if(state.person === 'paulo'){
      content.appendChild(buildOrcamentoPaulo(pauloData, homeData));
      content.appendChild(buildRemuneracoesCard(pauloData, homeData));
    } else {
      content.appendChild(buildOrcamentoHome(homeData, pauloData));
      const { liquida } = calcHomeOrcamento(homeData, pauloData);
      content.appendChild(buildReceitasCard('home', homeData, liquida));
    }
    content.appendChild(buildDespesasCard(data));

    lastSnapshotCtx = {person: state.person, year: state.year, month: state.month};
    lastSnapshot = JSON.stringify(data);
    atualizarBotoesUndo();
  }

  function atualizarBotoesUndo(){
    const bU = document.getElementById('btnDesfazer');
    const bR = document.getElementById('btnRefazer');
    if(bU) bU.disabled = undoStack.length === 0;
    if(bR) bR.disabled = redoStack.length === 0;
  }

  function persistOnly(){
    saveData(state.person, state.year, state.month);
  }

  function persistAndRerender(){
    const key = storageKey(state.person, state.year, state.month);
    const atualStr = JSON.stringify(cache[key]);
    if(lastSnapshotCtx && lastSnapshotCtx.person===state.person && lastSnapshotCtx.year===state.year && lastSnapshotCtx.month===state.month && lastSnapshot !== null && lastSnapshot !== atualStr){
      undoStack.push({person: state.person, year: state.year, month: state.month, snapshot: lastSnapshot});
      if(undoStack.length > 30) undoStack.shift();
      redoStack = [];
    }
    saveData(state.person, state.year, state.month);
    render();
  }

  async function desfazer(){
    if(!undoStack.length) return;
    const entry = undoStack.pop();
    const key = storageKey(entry.person, entry.year, entry.month);
    const atual = cache[key] ? JSON.stringify(cache[key]) : JSON.stringify(await loadData(entry.person, entry.year, entry.month));
    redoStack.push({person: entry.person, year: entry.year, month: entry.month, snapshot: atual});
    if(redoStack.length > 30) redoStack.shift();
    cache[key] = JSON.parse(entry.snapshot);
    saveData(entry.person, entry.year, entry.month);
    state.person = entry.person; state.year = entry.year; state.month = entry.month;
    render();
  }

  async function refazer(){
    if(!redoStack.length) return;
    const entry = redoStack.pop();
    const key = storageKey(entry.person, entry.year, entry.month);
    const atual = cache[key] ? JSON.stringify(cache[key]) : JSON.stringify(await loadData(entry.person, entry.year, entry.month));
    undoStack.push({person: entry.person, year: entry.year, month: entry.month, snapshot: atual});
    if(undoStack.length > 30) undoStack.shift();
    cache[key] = JSON.parse(entry.snapshot);
    saveData(entry.person, entry.year, entry.month);
    state.person = entry.person; state.year = entry.year; state.month = entry.month;
    render();
  }

  document.getElementById('btnDesfazer').onclick = desfazer;
  document.getElementById('btnRefazer').onclick = refazer;

  // ---------- SUMMARY ----------
  function buildSummary(person, data, other){
    const wrap = document.createElement('div');
    wrap.className = 'scorecards';
    const t = calcTotals(person, data, other);
    wrap.innerHTML = `
      <div class="scorecard">
        <div class="scorecard-label">Total receitas</div>
        <div class="scorecard-valor azul">R$ ${fmt(t.totalReceitas)}</div>
        <div class="scorecard-sub">receita líquida + outras entradas</div>
      </div>
      <div class="scorecard">
        <div class="scorecard-label">Total contas</div>
        <div class="scorecard-valor laranja">R$ ${fmt(t.totalDespesas)}</div>
        <div class="scorecard-sub">todas as contas do mês</div>
      </div>
      <div class="scorecard">
        <div class="scorecard-label">Sobra após pagar tudo</div>
        <div class="scorecard-valor ${t.saldoFinal<0?'vermelho':'verde'}">R$ ${fmt(t.saldoFinal)}</div>
        <div class="scorecard-sub">receitas − contas do mês</div>
      </div>`;
    return wrap;
  }

  // ---------- STATUS DE PENDÊNCIAS ----------
  function buildStatusPendencias(data){
    const div = document.createElement('div');
    const despesas = data.despesas || [];
    const pendentes = despesas.filter(d=>!d.pago).length;
    const atrasadas = despesas.filter(d=>isAtrasada(d)).length;
    if(despesas.length === 0){
      div.className = 'status-banner neutro';
      div.textContent = 'Nenhuma conta lançada neste mês ainda.';
    } else if(atrasadas > 0){
      div.className = 'status-banner atrasada';
      div.textContent = `🔴 ${atrasadas} conta${atrasadas>1?'s':''} atrasada${atrasadas>1?'s':''}!`;
    } else if(pendentes === 0){
      div.className = 'status-banner ok';
      div.textContent = '✅ Tudo pago neste mês!';
    } else {
      div.className = 'status-banner pendente';
      div.textContent = `⚠️ ${pendentes} conta${pendentes>1?'s':''} pendente${pendentes>1?'s':''} (ainda dentro do prazo)`;
    }
    return div;
  }

  async function propagarHomeReceitaBruta(valorNovo){
    let cursor = { year: state.year, month: state.month };
    for(let i=1; i<=60; i++){
      cursor = nextYearMonth(cursor.year, cursor.month, 1);
      const futData = await loadData('home', cursor.year, cursor.month);
      futData._fixadoHome = futData._fixadoHome || {receita_bruta:false};
      if(futData._fixadoHome.receita_bruta) break;
      futData.receita_bruta = valorNovo;
      saveData('home', cursor.year, cursor.month);
    }
  }

  async function propagarPauloValor(campo, indice, valorNovo){
    let cursor = { year: state.year, month: state.month };
    for(let i=1; i<=60; i++){
      cursor = nextYearMonth(cursor.year, cursor.month, 1);
      const futData = await loadData('paulo', cursor.year, cursor.month);
      futData._fixado = futData._fixado || {contracheque:false, emp0:false, emp1:false, emp2:false};
      if(futData._fixado.contracheque) break;
      futData.contracheque = valorNovo;
      saveData('paulo', cursor.year, cursor.month);
    }
  }

  async function propagarPauloValorSimples(idx, valorNovo){
    let cursor = { year: state.year, month: state.month };
    for(let i=1; i<=60; i++){
      cursor = nextYearMonth(cursor.year, cursor.month, 1);
      const futData = await loadData('paulo', cursor.year, cursor.month);
      futData._fixado = futData._fixado || {};
      const fieldKey = 'emp'+idx;
      if(futData._fixado[fieldKey]) break;
      futData.emprestimos = futData.emprestimos || [];
      if(!futData.emprestimos[idx]) futData.emprestimos[idx] = {nome:'', valor:0, parcelaRef:null};
      if(futData.emprestimos[idx].parcelaRef) break;
      futData.emprestimos[idx].valor = valorNovo;
      saveData('paulo', cursor.year, cursor.month);
    }
  }

  function filtrarDescontosHome(homeData, pauloData){
    const meuEmp = pauloData.emprestimos && pauloData.emprestimos[2];
    const meuFinalizado = meuEmp && meuEmp.parcelaRef && resolverEmprestimo(meuEmp, state.year, state.month).finalizado;
    if(!meuFinalizado) return homeData.descontos || [];
    return (homeData.descontos||[]).filter(d=>!/empr[ée]stimo/i.test(d.nome||''));
  }

  function abrirModalParcelamento(e){
    return new Promise((resolve)=>{
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal-box">
          <div class="modal-titulo">Parcelamento — ${e.nome || 'empréstimo'}</div>
          <div class="modal-texto">Diga em que parcela esse empréstimo está NESTE mês (${MONTH_LABELS[MONTHS.indexOf(state.month)]}/${state.year}). A partir disso, o sistema calcula sozinho a parcela certa em qualquer mês, sem precisar editar mês a mês.</div>
          <div class="modal-campos">
            <label>Valor da parcela<input type="number" step="0.01" class="m-valor" value="${e.valor||''}"></label>
            <label>Parcela atual neste mês (nº)<input type="number" min="1" class="m-atual" value="${e.parcelaRef ? e.parcelaRef.parcela : ''}"></label>
            <label>Total de parcelas<input type="number" min="1" class="m-total" value="${e.parcelaRef ? e.parcelaRef.total : ''}"></label>
          </div>
          <div class="modal-botoes">
            <button class="modal-btn destaque" data-v="aplicar">Aplicar</button>
            <button class="modal-btn" data-v="remover">Remover parcelamento (fica recorrente)</button>
            <button class="modal-btn cancelar" data-v="cancelar">Cancelar</button>
          </div>
        </div>`;
      const get = (cls)=>overlay.querySelector(cls);
      overlay.querySelectorAll('.modal-btn').forEach(b=>{
        b.onclick = ()=>{
          const v = b.dataset.v;
          document.body.removeChild(overlay);
          if(v === 'cancelar'){ resolve(null); return; }
          if(v === 'remover'){ resolve({valor: parseFloat(get('.m-valor').value)||0, atual:null, total:null}); return; }
          resolve({
            valor: parseFloat(get('.m-valor').value)||0,
            atual: get('.m-atual').value ? parseInt(get('.m-atual').value) : null,
            total: get('.m-total').value ? parseInt(get('.m-total').value) : null
          });
        };
      });
      document.body.appendChild(overlay);
    });
  }

  function aplicarParcelamento(e, data, resultado){
    if(!resultado) return;
    e.valor = resultado.valor;
    if(resultado.atual && resultado.total){
      e.parcelaRef = { year: state.year, month: state.month, parcela: resultado.atual, total: resultado.total };
    } else {
      e.parcelaRef = null;
    }
    persistAndRerender();
  }

  function renderEmprestimoRow(e, idx, data){
    const row = document.createElement('div');
    row.className = 'linha emprestimo-linha';
    const resolvido = resolverEmprestimo(e, state.year, state.month);

    let nome;
    if(idx < 3){
      nome = document.createElement('span');
      nome.className = 'nome';
      nome.style.pointerEvents = 'none';
      nome.style.opacity = '.85';
      nome.textContent = e.nome;
    } else {
      nome = document.createElement('input');
      nome.className = 'nome'; nome.value = e.nome;
      nome.oninput = ()=>{ e.nome = nome.value; persistOnly(); };
      nome.onblur = ()=>{ render(); };
    }
    row.appendChild(nome);

    const valI = makeMoneyInput(
      ()=>e.valor,
      (v)=>{
        e.valor = v;
        data._fixado = data._fixado || {};
        data._fixado['emp'+idx] = true;
        persistAndRerender();
        if(!e.parcelaRef) propagarPauloValorSimples(idx, v);
      },
      'valor'
    );
    row.appendChild(valI);

    if(resolvido.parcelaTotal){
      const tag = document.createElement('span');
      tag.className = 'parcela-tag';
      tag.textContent = `(${resolvido.parcelaAtual}/${resolvido.parcelaTotal})`;
      row.appendChild(tag);
    }

    const btnParcelar = document.createElement('button');
    btnParcelar.className = 'btn-parcelar';
    btnParcelar.textContent = '⚙';
    btnParcelar.title = 'Definir parcelamento';
    btnParcelar.onclick = async ()=>{
      const resultado = await abrirModalParcelamento(e);
      aplicarParcelamento(e, data, resultado);
    };
    row.appendChild(btnParcelar);

    if(idx >= 3){
      const del = document.createElement('button');
      del.className = 'del'; del.innerHTML = '✕';
      del.onclick = ()=>{ data.emprestimos.splice(idx,1); persistAndRerender(); };
      row.appendChild(del);
    }
    return row;
  }

  // ---------- ORÇAMENTO PAULO ----------

    brutaBox.innerHTML = `<span class="lbl">Receita bruta</span><span class="val">R$ ${fmt(receitaBruta)}</span>`;
    card.appendChild(brutaBox);

    const liqRow = document.createElement('div');
    liqRow.className = 'bruta-linha';

        data.contracheque = v;
        data._fixado = data._fixado || {};
        data._fixado.contracheque = true;

        propagarPauloValor('contracheque', null, v);
      },

    );
    liqRow.appendChild(liqInput);

    const label = document.createElement('div');

    label.textContent = 'Empréstimos fixos';
    card.appendChild(label);

    const list = document.createElement('div');
    (data.emprestimos||[]).forEach((e, idx)=>{
      const finalizadoSemUso = resolverEmprestimo(e, state.year, state.month).finalizado;

      list.appendChild(renderEmprestimoRow(e, idx, data));

    const enameI = addEmpLine.querySelector('.f-nome');
    const evalI = addEmpLine.querySelector('.f-valor');
    addEmpLine.querySelector('.btn-add').onclick = ()=>{

      data.emprestimos.push({nome, valor, parcelaRef:null});

      persistAndRerender();

    const liquidaBox = document.createElement('div');

    descLabel.textContent = 'Descontos (subtraem)';

  function getIconeConta(nome){
    const n = (nome||'').toLowerCase();
    const mapa = [
      [['água','agua'], '💧'],
      [['energia','luz','enel','coelce'], '⚡'],
      [['internet','wifi','net ','alares'], '🌐'],
      [['telefone','celular','tim','vivo','claro','oi ','pago oi'], '📱'],
      [['aluguel'], '🏠'],
      [['condomínio','condominio'], '🏢'],
      [['mercado','feira','supermercado','compras'], '🛒'],
      [['combustível','combustivel','gasolina','posto'], '⛽'],
      [['farmácia','farmacia','remédio','remedio','saúde','saude','médico','medico','plano'], '💊'],
      [['escola','colégio','colegio','faculdade','curso','reforço','reforco'], '🎓'],
      [['cartão','cartao','crédito','credito','visa','master'], '💳'],
      [['carro','consórcio','consorcio','veículo','veiculo'], '🚗'],
      [['seguro'], '🛡️'],
      [['funerária','funeraria','jazigo'], '🕯️'],
      [['tv','streaming','netflix','clube'], '📺'],
      [['empréstimo','emprestimo'], '💸'],
      [['iptu','imposto','taxa'], '🧾'],
    ];
    for(const [chaves, icone] of mapa){
      if(chaves.some(k=>n.includes(k))) return icone;
    }
    return '📄';
  }

  // ---------- RECEITAS (Home apenas) ----------
  function buildReceitasCard(person, data, liquidaBase){
    const card = document.createElement('div');
    card.className = 'card';
    const soma = (data.receitas||[]).reduce((s,r)=>s+(Number(r.valor)||0),0);
    const novaRenda = (Number(liquidaBase)||0) + soma;
    card.innerHTML = `<div class="card-titulo"><span><span class="tag">2</span>Receitas extras (eventuais)</span></div>`;
    const list = document.createElement('div');
    renderListaSimples(list, data.receitas, null, ()=>{ persistAndRerender(); });
    card.appendChild(list);
    card.appendChild(addLineFor('+ Receita extra', (nome,valor)=>{
      data.receitas.push({nome,valor}); persistAndRerender();
    }));
    const novaRendaBox = document.createElement('div');
    novaRendaBox.className = 'liquida-box';
    novaRendaBox.innerHTML = `<span class="lbl">Nova renda (líquida + extras)</span><span class="val">R$ ${fmt(novaRenda)}</span>`;
    card.appendChild(novaRendaBox);
    return card;
  }

  function renderListaSimples(container, arr, corValor, onChange){
    container.innerHTML = '';
    (arr||[]).forEach((item, i)=>{
      const row = document.createElement('div');
      row.className = 'linha';
      const nameI = document.createElement('input');
      nameI.className = 'nome'; nameI.value = item.nome;
      nameI.oninput = ()=>{ item.nome = nameI.value; persistOnly(); };
      const valI = makeMoneyInput(()=>item.valor, (v)=>{ item.valor = v; onChange(); }, 'valor');
      if(corValor) valI.style.color = corValor;
      const del = document.createElement('button');
      del.className = 'del'; del.innerHTML = '✕';
      del.onclick = ()=>{ arr.splice(i,1); renderListaSimples(container, arr, corValor, onChange); onChange(); };
      row.appendChild(nameI); row.appendChild(valI); row.appendChild(del);
      container.appendChild(row);
    });
    if(!(arr||[]).length){ container.innerHTML = '<div class="empty-hint">Nenhum item.</div>'; }
  }

  function addLineFor(label, onAdd){
    const addLine = document.createElement('div');
    addLine.className = 'add-linha';
    addLine.innerHTML = `<input class="f-nome" placeholder="Nome"><input class="f-valor" type="number" step="0.01" placeholder="Valor"><button class="btn-add">${label}</button>`;
    const nameI = addLine.querySelector('.f-nome');
    const valI = addLine.querySelector('.f-valor');
    addLine.querySelector('.btn-add').onclick = ()=>{
      const nome = nameI.value.trim();
      const valor = parseFloat(valI.value)||0;
      if(!nome) return;
      onAdd(nome, valor);
      nameI.value=''; valI.value='';
    };
    return addLine;
  }

  // ---------- DESPESAS ----------
  function buildDespesasCard(data){
    const card = document.createElement('div');
    card.className = 'card';
    const tagNum = state.person==='paulo' ? '4' : '3';
    card.innerHTML = `<div class="card-titulo"><span><span class="tag">${tagNum}</span>Contas do mês</span></div>`;

    const list = document.createElement('div');
    renderDespesasList(list, data);
    card.appendChild(list);

    const addLine = document.createElement('div');
    addLine.className = 'add-linha';
    addLine.innerHTML = `
      <input class="f-dia" type="number" min="1" max="31" placeholder="Dia">
      <input class="f-nome" placeholder="Nova conta">
      <input class="f-valor" type="number" step="0.01" placeholder="Valor">
      <input class="f-parcelas" type="number" min="1" max="60" placeholder="Nº parcelas">
      <button class="btn-add">+ Conta</button>`;
    const dayI = addLine.querySelector('.f-dia');
    const nameI = addLine.querySelector('.f-nome');
    const valI = addLine.querySelector('.f-valor');
    const parcI = addLine.querySelector('.f-parcelas');
    addLine.querySelector('.btn-add').onclick = async ()=>{
      const nome = nameI.value.trim();
      const valor = parseFloat(valI.value)||0;
      const dia = dayI.value ? parseInt(dayI.value) : null;
      const parcelas = parcI.value ? Math.max(1, parseInt(parcI.value)) : 1;
      if(!nome) return;
      const parcelaId = parcelas > 1 ? ('p_' + Date.now() + '_' + Math.random().toString(36).slice(2,7)) : null;
      data.despesas.push({nome, valor, vencimento: dia, pago:false, parcelaId, parcelaIndex: 0, parcelaTotal: parcelas});
      persistAndRerender();
      for(let i=1; i<parcelas; i++){
        const alvo = nextYearMonth(state.year, state.month, i);
        const futData = await loadData(state.person, alvo.year, alvo.month);
        futData.despesas.push({nome, valor, vencimento: dia, pago:false, parcelaId, parcelaIndex: i, parcelaTotal: parcelas});
        saveData(state.person, alvo.year, alvo.month);
      }
      dayI.value=''; nameI.value=''; valI.value=''; parcI.value='';
    };
    card.appendChild(addLine);

    const copiarWrap = document.createElement('div');
    copiarWrap.className = 'copiar-mes';
    copiarWrap.innerHTML = `
      <span class="copiar-label">Copiar contas de:</span>
      <select class="select-data copiar-mes-sel"></select>
      <select class="select-data copiar-ano-sel"></select>
      <button class="btn-add">Copiar</button>`;
    const selMes = copiarWrap.querySelector('.copiar-mes-sel');
    const selAno = copiarWrap.querySelector('.copiar-ano-sel');
    selMes.innerHTML = MONTHS.map((m,i)=>`<option value="${m}">${MONTH_LABELS[i]}</option>`).join('');
    selAno.innerHTML = YEARS.map(y=>`<option value="${y}">${y}</option>`).join('');
    const anteriorIdx = MONTHS.indexOf(state.month) - 1;
    const mesPadrao = anteriorIdx >= 0 ? MONTHS[anteriorIdx] : MONTHS[11];
    selMes.value = mesPadrao;
    selAno.value = anteriorIdx >= 0 ? state.year : String(parseInt(state.year)-1);
    copiarWrap.querySelector('.btn-add').onclick = async ()=>{
      const origemMes = selMes.value, origemAno = selAno.value;
      if(origemAno === state.year && origemMes === state.month) return;
      const origemData = await loadData(state.person, origemAno, origemMes);
      if(!origemData.despesas.length) return;
      const ok = await confirmCopia(origemData.despesas.length, MONTH_LABELS[MONTHS.indexOf(origemMes)], origemAno);
      if(!ok) return;
      origemData.despesas.forEach(d=>{
        data.despesas.push({nome:d.nome, valor:d.valor, vencimento:d.vencimento, pago:false});
      });
      persistAndRerender();
    };
    card.appendChild(copiarWrap);

    const totalLine = document.createElement('div');
    totalLine.className = 'liquida-box vermelha';
    const totalContas = (data.despesas||[]).reduce((s,d)=>s+(Number(d.valor)||0),0);
    totalLine.innerHTML = `<span class="lbl">Total do mês</span><span class="val">R$ ${fmt(totalContas)}</span>`;
    card.appendChild(totalLine);

    return card;
  }

  function confirmCopia(qtd, mesLabel, ano){
    return new Promise((resolve)=>{
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal-box">
          <div class="modal-titulo">Copiar ${qtd} conta${qtd>1?'s':''} de ${mesLabel}/${ano}?</div>
          <div class="modal-texto">Elas serão adicionadas às contas já existentes neste mês, todas marcadas como pendentes.</div>
          <div class="modal-botoes">
            <button class="modal-btn destaque" data-v="sim">Copiar</button>
            <button class="modal-btn cancelar" data-v="nao">Cancelar</button>
          </div>
        </div>`;
      overlay.querySelectorAll('.modal-btn').forEach(b=>{
        b.onclick = ()=>{ document.body.removeChild(overlay); resolve(b.dataset.v==='sim'); };
      });
      document.body.appendChild(overlay);
    });
  }

  function confirmParcela(despesa){
    return new Promise((resolve)=>{
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal-box">
          <div class="modal-titulo">"${despesa.nome}" faz parte de um parcelamento (${despesa.parcelaTotal}x)</div>
          <div class="modal-texto">O que deseja fazer com as parcelas dos próximos meses?</div>
          <div class="modal-botoes">
            <button class="modal-btn" data-v="only">Apagar só esta</button>
            <button class="modal-btn destaque" data-v="future">Apagar esta e as futuras</button>
            <button class="modal-btn cancelar" data-v="cancel">Cancelar</button>
          </div>
        </div>`;
      overlay.querySelectorAll('.modal-btn').forEach(b=>{
        b.onclick = ()=>{ document.body.removeChild(overlay); resolve(b.dataset.v); };
      });
      document.body.appendChild(overlay);
    });
  }

  async function apagarParcelasFuturas(parcelaId, indexAtual, total){
    const restantes = total - indexAtual - 1;
    for(let i=1; i<=restantes; i++){
      const alvo = nextYearMonth(state.year, state.month, i);
      const futData = await loadData(state.person, alvo.year, alvo.month);
      const antes = futData.despesas.length;
      futData.despesas = futData.despesas.filter(d=>d.parcelaId !== parcelaId);
      if(futData.despesas.length !== antes){
        cache[storageKey(state.person, alvo.year, alvo.month)] = futData;
        saveData(state.person, alvo.year, alvo.month);
      }
    }
  }

  function isAtrasada(d){
    if(d.pago) return false;
    const now = new Date();
    const anoAtual = String(now.getFullYear());
    const mesAtualIdx = now.getMonth();
    const mesEstadoIdx = MONTHS.indexOf(state.month);
    const anoEstado = parseInt(state.year);
    const anoAtualNum = parseInt(anoAtual);
    if(anoEstado < anoAtualNum) return true;
    if(anoEstado > anoAtualNum) return false;
    if(mesEstadoIdx < mesAtualIdx) return true;
    if(mesEstadoIdx > mesAtualIdx) return false;
    if(d.vencimento == null) return false;
    return d.vencimento < now.getDate();
  }

  function renderDespesasList(container, data){
    container.innerHTML = '';
    const items = data.despesas.map((d,i)=>({...d, _i:i}));
    items.sort((a,b)=>{
      const av = a.vencimento==null ? 999 : a.vencimento;
      const bv = b.vencimento==null ? 999 : b.vencimento;
      return av - bv;
    });
    if(!items.length){ container.innerHTML = '<div class="empty-hint">Nenhuma conta lançada ainda.</div>'; return; }
    items.forEach(d=>{
      const atrasada = isAtrasada(d);
      const row = document.createElement('div');
      row.className = 'despesa-linha' + (d.pago ? ' pago' : '') + (atrasada ? ' atrasada' : '');

      const icone = document.createElement('span');
      icone.className = 'icone-conta';
      icone.textContent = getIconeConta(d.nome);
      row.appendChild(icone);

      const dayI = document.createElement('input');
      dayI.className = 'dia' + (d.vencimento==null ? ' vazio':'');
      dayI.type = 'number'; dayI.min='1'; dayI.max='31';
      dayI.value = d.vencimento==null ? '' : d.vencimento;
      dayI.placeholder = '—';
      dayI.onchange = ()=>{
        const v = dayI.value ? parseInt(dayI.value) : null;
        data.despesas[d._i].vencimento = v;
        persistAndRerender();
      };
      row.appendChild(dayI);

      const nameI = document.createElement('input');
      nameI.className='nome'; nameI.value=d.nome;
      nameI.oninput = ()=>{ data.despesas[d._i].nome = nameI.value; persistOnly(); };
      nameI.onblur = ()=>{ render(); };
      row.appendChild(nameI);

      if(d.parcelaTotal && d.parcelaTotal > 1){
        const tag = document.createElement('span');
        tag.className = 'parcela-tag';
        tag.textContent = `(${d.parcelaIndex+1}/${d.parcelaTotal})`;
        row.appendChild(tag);
      }

      const valI = makeMoneyInput(
        ()=>data.despesas[d._i].valor,
        (v)=>{ data.despesas[d._i].valor = v; persistAndRerender(); },
        'valor'
      );
      row.appendChild(valI);

      const stamp = document.createElement('button');
      stamp.className = 'status-toggle ' + (d.pago ? 'pago' : (atrasada ? 'atrasada' : 'pendente'));
      stamp.textContent = d.pago ? '✓ PAGO' : (atrasada ? '⚠ ATRASADA' : 'PENDENTE');
      stamp.onclick = ()=>{
        data.despesas[d._i].pago = !data.despesas[d._i].pago;
        persistAndRerender();
      };
      row.appendChild(stamp);

      const del = document.createElement('button');
      del.className='del'; del.innerHTML='✕';
      del.onclick = async ()=>{
        const despesa = data.despesas[d._i];
        if(despesa.parcelaId){
          const escolha = await confirmParcela(despesa);
          if(escolha === 'cancel') return;
          data.despesas.splice(d._i,1);
          persistAndRerender();
          if(escolha === 'future'){
            await apagarParcelasFuturas(despesa.parcelaId, despesa.parcelaIndex, despesa.parcelaTotal);
          }
        } else {
          data.despesas.splice(d._i,1);
          persistAndRerender();
        }
      };
      row.appendChild(del);

      container.appendChild(row);
    });
  }

  render();
})();
</script>
